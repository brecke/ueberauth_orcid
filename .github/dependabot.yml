version: 2
updates:
  # Mix supports version updates, not security-update PRs; CI audits weekly.
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      devtools:
        dependency-type: development
      runtime:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
